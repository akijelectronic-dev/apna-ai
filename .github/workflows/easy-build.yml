name: Easy build (APK)

# Works in both cases:
#  - repo has sadia-app.zip in the main folder, or
#  - the project files (package.json, www, native, ...) are already in the main folder.
# Run: Actions -> Easy build (APK) -> Run workflow. The APK appears under Releases.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # keeps the same debug signing key between builds so the APK can update over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sadia-debug-keystore-v1

      - name: Find the project
        run: |
          if [ -f sadia-app.zip ]; then
            unzip -q sadia-app.zip -d build
            echo "DIR=build/sadia-app" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi
          echo "Project folder: $(grep DIR "$GITHUB_ENV")"

      - name: Check files
        run: |
          for f in package.json capacitor.config.json www/index.html native/java/VXDevicePlugin.java scripts/setup-android.js; do
            test -f "$DIR/$f" || { echo "ফাইল পাওয়া যায়নি: $f (প্রজেক্টের সব ফাইল রিপোতে আছে কি দেখুন)"; exit 1; }
          done

      - name: Prepare
        working-directory: ${{ env.DIR }}
        run: |
          echo "VERSION_NAME=2.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#g" www/js/config.js
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));if(c.server)delete c.server.url;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Install
        working-directory: ${{ env.DIR }}
        run: npm install

      - name: Create Android project
        working-directory: ${{ env.DIR }}
        run: |
          npx cap add android
          node scripts/setup-android.js
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect
        run: cp "$DIR/android/app/build/outputs/apk/debug/app-debug.apk" sadia.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Sadia AI v2.2.${{ github.run_number }}
          files: sadia.apk
