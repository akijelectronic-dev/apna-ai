name: Easy build (APK)

# Easiest way: upload sadia-app.zip to the repo's main folder, then Actions -> "Easy build (APK)" -> Run workflow.
# No keystore and no secrets needed. The APK appears under Releases.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # keeps the same debug signing key between builds so the APK can update over the old one
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sadia-debug-keystore-v1

      - name: Unpack
        run: |
          test -f sadia-app.zip || { echo "sadia-app.zip রিপোর মূল ফোল্ডারে নেই"; exit 1; }
          unzip -q sadia-app.zip -d build

      - name: Prepare
        working-directory: build/sadia-app
        run: |
          echo "VERSION_NAME=2.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#g" www/js/config.js
          node -e "const fs=require('fs');const f='capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));delete c.server.url;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Install
        working-directory: build/sadia-app
        run: npm install

      - name: Create Android project
        working-directory: build/sadia-app
        run: |
          npx cap add android
          node scripts/setup-android.js
          npx cap sync android

      - name: Build APK
        working-directory: build/sadia-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect
        run: cp build/sadia-app/android/app/build/outputs/apk/debug/app-debug.apk sadia.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.${{ github.run_number }}
          name: Sadia AI v2.2.${{ github.run_number }}
          files: sadia.apk
